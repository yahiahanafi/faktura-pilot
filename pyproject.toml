[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faktura-pilot"
version = "0.1.0"
description = "Order image extraction and validated Fakturama automation foundations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.66,<3",
    "pydantic>=2.8,<3",
]

[project.optional-dependencies]
automation = [
    "pywinauto>=0.6.8; platform_system == 'Windows'",
]
ocr = [
    "pytesseract>=0.3.13",
    "opencv-python-headless>=4.10",
]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.9,<1",
]

[project.scripts]
image-to-cash = "faktura_pilot.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
